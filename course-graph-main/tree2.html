<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .link { stroke: #aaa; stroke-width: 2px; }
    .node circle { fill: lightblue; stroke: #005eff; stroke-width: 1.5px; }
    text { font-size: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <svg width="1080" height="700"></svg>

  <script>
    window.onload = function() {
      const graph = {
        nodes: [{ id: "A", desc: "asdkjashdjka"}, { id: "B" }, { id: "C" }, {id: "D"}],
        links: [{ source: "A", target: "B" }, { source: "A", target: "C" }, {source: "C", target: "D"}]
      };

      const svg = d3.select("svg");
      const width = +svg.attr("width");
      const height = +svg.attr("height");

      const simulation = d3.forceSimulation(graph.nodes)
        .force("link", d3.forceLink(graph.links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-500))
        .force("center", d3.forceCenter(width / 2, height / 2));

      const link = svg.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(graph.links)
        .enter().append("line")
        .attr("class", "link");

      const node = svg.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(graph.nodes)
        .enter().append("g")
        .call(d3.drag()
          .on("start", dragStarted)
          .on("drag", dragged)
          .on("end", dragEnded));

      node.append("circle").attr("r", 10);
      node.append("text")
        .attr("dy", -15)
        .attr("text-anchor", "middle")
        .text(d => d.id);

      node.append("text")
      .attr("dy", -15)
      .attr("text-anchor", "bottom")
      .text(d => d.desc);

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("transform", d => `translate(${d.x},${d.y})`);
      });

      function dragStarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragEnded(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
    };
  </script>
</body>
</html>
